[project]
name = "vibedm-backend"
version = "0.1.0"
description = "FastAPI backend for Vibedm/DMFlow"
requires-python = ">=3.11,<3.15"
dependencies = [
  "asyncpg>=0.30.0",
  "fastapi>=0.124.0",
  "httpx>=0.28.1",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.1",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.45",
  "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.14.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
