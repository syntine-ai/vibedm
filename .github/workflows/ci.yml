name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv sync --frozen
        working-directory: ./vibedm_backend

      - name: Run Ruff Linter
        run: |
          uv run ruff check .
        working-directory: ./vibedm_backend

      - name: Run Backend Tests
        run: |
          uv run pytest
        working-directory: ./vibedm_backend

  frontend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./vibedm_frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci
        working-directory: ./vibedm_frontend

      - name: Run ESLint
        run: |
          npm run lint
        working-directory: ./vibedm_frontend

      - name: Run Frontend Tests
        run: |
          npm run test -- --run
        working-directory: ./vibedm_frontend
