name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'vibedm_frontend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ./vibedm_frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
        working-directory: ./vibedm_frontend

      - name: Build Frontend
        run: |
          npm run build
        working-directory: ./vibedm_frontend
        env:
          # Build-time environment variables can be set here if needed
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare
        run: |
          rm -rf ../../.wrangler
          npx wrangler deploy
        working-directory: ./vibedm_frontend/dist/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
